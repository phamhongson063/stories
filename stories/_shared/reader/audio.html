<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Nghe audio</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    background: #12141d;
    color: #fff;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    overflow: hidden;
  }
  .screen {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: calc(16px + env(safe-area-inset-top)) 20px calc(16px + env(safe-area-inset-bottom));
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex: none;
  }
  .backBtn {
    background: none;
    border: none;
    color: #fff;
    font-size: 22px;
    padding: 6px 10px;
    cursor: pointer;
  }
  .topbar-title {
    text-align: center;
    flex: 1;
  }
  .topbar-title .eyebrow {
    display: block;
    font-size: 0.75em;
    letter-spacing: 0.1em;
    color: #9aa0b4;
  }
  .topbar-title .chname {
    display: block;
    font-size: 1em;
    color: #fff;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .topbar-spacer { width: 40px; flex: none; }

  .cover-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    padding: 20px 0;
  }
  .cover {
    max-height: 100%;
    max-width: 100%;
    width: 260px;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    border-radius: 0;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    background: #2a2e40;
  }

  .meta { flex: none; text-align: center; padding: 6px 0 10px; }
  .chapter-title {
    font-size: 1.4em;
    font-weight: 700;
    margin: 0 0 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .story-name {
    margin: 0;
    color: #9aa0b4;
    font-size: 1.05em;
  }
  .audio-error {
    margin: 10px 0 0;
    color: #f2b84b;
    font-size: 0.9em;
  }

  .progress { flex: none; padding: 10px 0 0; }
  .progress input[type="range"] {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 2px;
    background: #383c4d;
    outline: none;
  }
  .progress input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
  }
  .progress input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    border: none;
    cursor: pointer;
  }
  .time-row {
    display: flex;
    justify-content: space-between;
    color: #9aa0b4;
    font-size: 0.85em;
    padding-top: 6px;
  }

  .controls {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 0 10px;
  }
  .controls button {
    background: none;
    border: none;
    color: #fff;
    cursor: pointer;
    padding: 8px;
  }
  .ctrl-small { font-size: 26px; }
  .ctrl-seek { display: flex; align-items: center; justify-content: center; }
  .ctrl-seek svg { width: 34px; height: 34px; }
  .play-btn {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: linear-gradient(180deg, #58c8ff, #2f8fe0);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
  }

  .chapter-list-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: rgba(255,255,255,0.04);
    border-radius: 14px;
    margin-top: 6px;
    overflow: hidden;
  }
  .chapter-list-title {
    flex: none;
    padding: 10px 14px;
    font-size: 0.85em;
    color: #9aa0b4;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .chapter-list {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .chapter-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .chapter-item:active { background: rgba(255,255,255,0.06); }
  .chapter-item.active {
    background: rgba(88,200,255,0.12);
    color: #58c8ff;
  }
  .chapter-item-name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <button class="backBtn" id="backBtn">‹</button>
      <div class="topbar-title">
        <span class="eyebrow">ĐANG PHÁT</span>
        <span class="chname" id="chapterLabel">Chương 001</span>
      </div>
      <div class="topbar-spacer"></div>
    </div>

    <div class="cover-wrap">
      <img class="cover" id="cover" src="" alt="">
    </div>

    <div class="meta">
      <p class="chapter-title" id="chapterTitle">Chương 001</p>
      <p class="story-name" id="storyName"></p>
      <p class="audio-error" id="audioError" style="display:none">Chưa có audio cho chương này</p>
    </div>

    <div class="progress">
      <input type="range" id="seekBar" min="0" max="100" value="0">
      <div class="time-row">
        <span id="curTime">00:00</span>
        <span id="durTime">00:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="ctrl-small" id="prevChBtn">⏮</button>
      <button class="ctrl-seek" id="back10Btn">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 6 A10 10 0 1 1 6.5 12.5" />
          <polygon points="16,1 16,11 8,6" fill="currentColor" stroke="none"/>
          <text x="16" y="21" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="currentColor" stroke="none">10</text>
        </svg>
      </button>
      <button class="play-btn" id="playBtn">▶</button>
      <button class="ctrl-seek" id="fwd10Btn">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 6 A10 10 0 1 0 25.5 12.5" />
          <polygon points="16,1 16,11 24,6" fill="currentColor" stroke="none"/>
          <text x="16" y="21" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="currentColor" stroke="none">10</text>
        </svg>
      </button>
      <button class="ctrl-small" id="nextChBtn">⏭</button>
    </div>

    <div class="chapter-list-wrap">
      <div class="chapter-list-title">Chọn chương audio</div>
      <div class="chapter-list" id="chapterList"></div>
    </div>
  </div>

  <audio id="player"></audio>

<script>
function getStorySlug() {
  const params = new URLSearchParams(window.location.search);
  const story = params.get('story');
  if (!story) {
    document.body.innerHTML = '<p style="padding:20px">Thiếu tham số "story" trong URL.</p>';
    throw new Error('missing story param');
  }
  return story;
}

const STORY = getStorySlug();
const STORY_DIR = '../../' + STORY + '/';
const CHAPTER_KEY = 'currentChapter:' + STORY;
const TIME_KEY_PREFIX = 'chapterTime:' + STORY + ':';

let TOTAL_AUDIO_CHAPTERS = 0;
let CHAPTER_DIGITS = 3;

function pad(num) {
  return String(num).padStart(CHAPTER_DIGITS, '0');
}

function getChapterFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const ch = params.get('ch');
  if (ch) return parseInt(ch, 10) || 1;
  const saved = localStorage.getItem(CHAPTER_KEY);
  return saved ? parseInt(saved, 10) : 1;
}

function formatTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

const player = document.getElementById('player');
const playBtn = document.getElementById('playBtn');
const seekBar = document.getElementById('seekBar');
const curTime = document.getElementById('curTime');
const durTime = document.getElementById('durTime');
const chapterLabel = document.getElementById('chapterLabel');
const chapterTitle = document.getElementById('chapterTitle');
const audioError = document.getElementById('audioError');
const chapterListEl = document.getElementById('chapterList');
const coverEl = document.getElementById('cover');
const storyNameEl = document.getElementById('storyName');

let currentChapter = getChapterFromUrl();
let seeking = false;
let pendingResumeChapter = null;

function updateReadingProgress(num) {
  const padded = pad(num);
  localStorage.setItem(CHAPTER_KEY, padded);
  const url = new URL(window.location);
  url.searchParams.set('ch', num);
  window.history.replaceState({}, '', url);
}

function getSavedTime(num) {
  const t = localStorage.getItem(TIME_KEY_PREFIX + pad(num));
  return t ? parseFloat(t) : 0;
}

function saveTime(num, time) {
  localStorage.setItem(TIME_KEY_PREFIX + pad(num), String(time));
}

async function loadChapterTitle(num) {
  const padded = pad(num);
  try {
    const res = await fetch(STORY_DIR + 'vi/' + padded + '.html');
    if (!res.ok) throw new Error('not found');
    const text = await res.text();
    const match = text.match(/<h1>(.*?)<\/h1>/);
    return match ? match[1] : ('Chương ' + padded);
  } catch (e) {
    return 'Chương ' + padded;
  }
}

async function loadChapter(num, autoplay) {
  currentChapter = num;
  const padded = pad(num);
  chapterLabel.textContent = 'Chương ' + padded;
  chapterTitle.textContent = 'Chương ' + padded;
  audioError.style.display = 'none';
  updateReadingProgress(num);
  highlightActiveChapter();

  const title = await loadChapterTitle(num);
  if (currentChapter === num) chapterTitle.textContent = title;

  pendingResumeChapter = num;
  player.src = STORY_DIR + 'audio/' + padded + '.mp3';
  if (autoplay) {
    player.play().catch(() => {});
  } else {
    player.pause();
  }
}

function highlightActiveChapter() {
  const items = chapterListEl.querySelectorAll('.chapter-item');
  items.forEach(item => {
    item.classList.toggle('active', parseInt(item.dataset.ch, 10) === currentChapter);
  });
}

function buildChapterList() {
  chapterListEl.innerHTML = '';
  for (let i = 1; i <= TOTAL_AUDIO_CHAPTERS; i++) {
    const item = document.createElement('div');
    item.className = 'chapter-item';
    item.dataset.ch = String(i);

    const name = document.createElement('span');
    name.className = 'chapter-item-name';
    name.textContent = 'Chương ' + pad(i);

    item.appendChild(name);
    item.addEventListener('click', () => {
      loadChapter(i, true);
    });
    chapterListEl.appendChild(item);

    loadChapterTitle(i).then(title => {
      name.textContent = title;
    });
  }
  highlightActiveChapter();
}

playBtn.addEventListener('click', () => {
  if (player.paused) {
    player.play().catch(() => {});
  } else {
    player.pause();
  }
});

player.addEventListener('play', () => { playBtn.textContent = '⏸'; });
player.addEventListener('pause', () => { playBtn.textContent = '▶'; });

player.addEventListener('error', () => {
  audioError.style.display = 'block';
});

player.addEventListener('loadedmetadata', () => {
  seekBar.max = String(Math.floor(player.duration) || 0);
  durTime.textContent = formatTime(player.duration);

  if (pendingResumeChapter === currentChapter) {
    const saved = getSavedTime(currentChapter);
    if (saved > 0 && saved < player.duration) {
      player.currentTime = saved;
      seekBar.value = String(Math.floor(saved));
      curTime.textContent = formatTime(saved);
    }
    pendingResumeChapter = null;
  }
});

player.addEventListener('timeupdate', () => {
  if (seeking) return;
  seekBar.value = String(Math.floor(player.currentTime));
  curTime.textContent = formatTime(player.currentTime);
  saveTime(currentChapter, player.currentTime);
});

seekBar.addEventListener('input', () => {
  seeking = true;
  curTime.textContent = formatTime(parseInt(seekBar.value, 10));
});
seekBar.addEventListener('change', () => {
  player.currentTime = parseInt(seekBar.value, 10);
  seeking = false;
});

document.getElementById('back10Btn').addEventListener('click', () => {
  player.currentTime = Math.max(0, player.currentTime - 10);
});
document.getElementById('fwd10Btn').addEventListener('click', () => {
  player.currentTime = Math.min(player.duration || Infinity, player.currentTime + 10);
});

document.getElementById('prevChBtn').addEventListener('click', () => {
  if (currentChapter > 1) loadChapter(currentChapter - 1, true);
});
document.getElementById('nextChBtn').addEventListener('click', () => {
  loadChapter(currentChapter + 1, true);
});

player.addEventListener('ended', () => {
  loadChapter(currentChapter + 1, true);
});

document.getElementById('backBtn').addEventListener('click', () => {
  window.location.href = 'index.html?story=' + STORY + '&ch=' + pad(currentChapter);
});

async function init() {
  coverEl.src = STORY_DIR + 'avatar.jpg';
  try {
    const res = await fetch(STORY_DIR + 'meta.json');
    const meta = res.ok ? await res.json() : {};
    storyNameEl.textContent = meta.name || STORY;
    TOTAL_AUDIO_CHAPTERS = meta.audioChapters || 0;
    CHAPTER_DIGITS = meta.chapterDigits || 3;
  } catch (e) {
    storyNameEl.textContent = STORY;
    TOTAL_AUDIO_CHAPTERS = 0;
  }
  buildChapterList();
  loadChapter(currentChapter, false);
}

init();
</script>
</body>
</html>
